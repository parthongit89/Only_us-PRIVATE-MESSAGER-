{% extends "base.html" %}

{% block title %}OnlyUs - Invite People{% endblock %}

{% block content %}
<div class="relative min-h-[90vh] flex flex-col items-center justify-center p-4 glow-01-bg">

  <div class="w-full max-w-md bg-gray-900/90 border border-gray-800 backdrop-blur-xl rounded-3xl p-8 shadow-2xl animate-fade-in relative z-10">
    
    <!-- Top Header -->
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-800/80">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Invite People</h1>
      <button onclick="toggleSideDrawer()" class="p-2 text-gray-400 hover:text-white rounded-full transition">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Invitation Form -->
    <form action="{{ url_for('user.invite') }}" method="POST" class="space-y-6">
      
      <div>
        <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Recipient Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter Gmail" 
          required 
          class="w-full bg-gray-950 border-2 border-orange-500/80 focus:border-orange-500 text-white placeholder-orange-400/60 rounded-2xl px-5 py-4 text-base outline-none transition shadow-inner" 
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-4 rounded-2xl shadow-xl shadow-orange-600/30 active:scale-[0.98] transition duration-200 text-lg flex items-center justify-center gap-2"
      >
        <i data-lucide="send" class="w-5 h-5"></i> Send Passcode
      </button>

    </form>

    <div class="mt-8 text-center border-t border-gray-800/60 pt-4">
      <a href="{{ url_for('chat.home') }}" class="text-sm font-semibold text-gray-400 hover:text-orange-400 transition flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Chats
      </a>
    </div>

  </div>

</div>
{% endblock %}
