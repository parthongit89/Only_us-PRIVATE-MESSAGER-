{% extends "base.html" %}

{% block title %}OnlyUs - Invite People{% endblock %}

{% block content %}
<div class="glow-01-bg min-h-screen flex flex-col justify-between p-6 max-w-md mx-auto relative">

  <!-- Top Navigation Header -->
  <div class="pt-8 flex items-center justify-between">
    <h1 class="text-3xl font-extrabold text-white tracking-tight">Invite People</h1>
    <button onclick="toggleSideDrawer()" class="p-2 text-white hover:text-orange-400 transition focus:outline-none">
      <i data-lucide="menu" class="w-7 h-7"></i>
    </button>
  </div>

  <!-- Central Invitation Form -->
  <form action="{{ url_for('user.invite') }}" method="POST" class="my-auto space-y-6 w-full animate-fade-in">
    <div>
      <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="Enter Gmail" 
        required 
        class="w-full bg-transparent border-2 border-orange-500/80 focus:border-orange-500 text-white placeholder-orange-500/80 rounded-2xl px-6 py-4 text-base outline-none transition shadow-sm" 
      />
    </div>

    <button 
      type="submit" 
      class="w-full bg-[#ea580c] hover:bg-orange-500 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-orange-600/30 active:scale-[0.98] transition duration-200 text-base tracking-wide"
    >
      Send Passcode
    </button>
  </form>

  <!-- Bottom Navigation Link -->
  <div class="pb-6 text-center">
    <a href="{{ url_for('chat.home') }}" class="text-sm font-medium text-gray-400 hover:text-orange-400 transition inline-flex items-center gap-1.5">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Chats
    </a>
  </div>

</div>
{% endblock %}
