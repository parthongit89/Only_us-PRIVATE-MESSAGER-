{% extends "base.html" %}

{% block title %}OnlyUs - Profile{% endblock %}

{% block content %}
<div class="app-container flex flex-col justify-between bg-gray-950 text-gray-100 border border-gray-800">

  <!-- Header -->
  <div class="bg-gradient-to-b from-gray-900 to-gray-950 px-6 pt-10 pb-6 flex items-center justify-between border-b border-gray-800">
    <a href="{{ url_for('chat.home') }}" class="p-2 hover:bg-gray-800 rounded-full text-gray-300">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <h2 class="text-xl font-light text-white">My Profile</h2>
    <div class="w-9"></div>
  </div>

  <!-- Profile Edit Form -->
  <div class="flex-1 px-8 py-4 overflow-y-auto animate-fade-in">
    <form action="{{ url_for('user.profile') }}" method="POST" class="space-y-6">
      
      <!-- Avatar Section -->
      <div class="flex flex-col items-center">
        <div class="w-24 h-24 bg-orange-950/80 border-4 border-gray-800 shadow-xl rounded-full flex items-center justify-center text-orange-400 text-3xl font-bold mb-3 overflow-hidden">
          {% if user.avatar and user.avatar != 'default_avatar.png' %}
            <img src="{{ url_for('static', filename='images/' + user.avatar) }}" class="w-full h-full object-cover" />
          {% else %}
            {{ user.username[0] }}
          {% endif %}
        </div>
        <span class="text-xs text-orange-400 font-semibold uppercase tracking-wider">{{ user.role }} Account</span>
      </div>

      <!-- Form Inputs -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Username</label>
          <input type="text" name="username" value="{{ user.username }}" required class="input-field bg-gray-900 border-gray-700 text-white" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Email Address</label>
          <input type="email" value="{{ user.email }}" disabled class="input-field bg-gray-900/50 border-gray-800 text-gray-500 cursor-not-allowed" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Bio</label>
          <input type="text" name="bio" value="{{ user.bio }}" class="input-field bg-gray-900 border-gray-700 text-white" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Login Passcode</label>
          <input type="password" name="passcode" value="{{ user.passcode or '' }}" placeholder="4-6 digit passcode" class="input-field bg-gray-900 border-gray-700 text-white" />
        </div>
      </div>

      <button type="submit" class="btn-primary mt-6 shadow-lg shadow-orange-500/30">Save Profile Changes</button>
    </form>
  </div>

  </div>

</div>
{% endblock %}
