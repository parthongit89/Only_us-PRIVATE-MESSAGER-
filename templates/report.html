{% extends "base.html" %}

{% block title %}OnlyUs - Report User{% endblock %}

{% block content %}
<div class="app-container flex flex-col justify-between bg-gray-950 text-gray-100 border border-gray-800">

  <!-- Header -->
  <div class="bg-gradient-to-b from-gray-900 to-gray-950 px-6 pt-10 pb-6 flex items-center justify-between border-b border-gray-800">
    <a href="{{ url_for('chat.home') }}" class="p-2 hover:bg-gray-800 rounded-full text-gray-300">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </a>
    <h2 class="text-xl font-light text-white">Report User</h2>
    <div class="w-9"></div>
  </div>

  <div class="flex-1 px-8 py-4 overflow-y-auto animate-fade-in">
    <form action="{{ url_for('user.report_user') }}" method="POST" class="space-y-6">
      
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Select User</label>
        <select name="reported_user_id" required class="input-field bg-gray-900 border-gray-700 text-white">
          <option value="">-- Choose User --</option>
          {% for u in users %}
            <option value="{{ u.id }}">{{ u.username }} ({{ u.email }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Reason for Reporting</label>
        <textarea name="reason" rows="4" placeholder="Describe the issue or policy violation..." required class="w-full p-4 bg-gray-900 border border-gray-700 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 text-sm text-white placeholder-gray-500"></textarea>
      </div>

      <button type="submit" class="btn-primary shadow-lg shadow-orange-500/30">Submit Report to Admin</button>
    </form>
  </div>

  <!-- Bottom Nav -->
  <div class="border-t border-gray-900 py-3 px-8 flex justify-between items-center bg-gray-900">
    <a href="{{ url_for('chat.home') }}" class="text-gray-500 hover:text-orange-400 flex flex-col items-center gap-1">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Chats</span>
    </a>
    <a href="{{ url_for('user.notifications') }}" class="text-gray-500 hover:text-orange-400 flex flex-col items-center gap-1">
      <i data-lucide="bell" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Notifications</span>
    </a>
    <a href="{{ url_for('user.profile') }}" class="text-gray-500 hover:text-orange-400 flex flex-col items-center gap-1">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Profile</span>
    </a>
    <a href="{{ url_for('user.settings') }}" class="text-gray-500 hover:text-orange-400 flex flex-col items-center gap-1">
      <i data-lucide="settings" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Settings</span>
    </a>
  </div>

</div>
{% endblock %}
