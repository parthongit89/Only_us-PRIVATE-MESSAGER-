{% extends "base.html" %}

{% block title %}OnlyUs - Verify OTP{% endblock %}

{% block content %}
<div class="app-container flex flex-col justify-between bg-gradient-to-b from-gray-900 via-gray-950 to-black p-8 text-gray-100 border border-gray-800">

  <div class="pt-12 text-center">
    <div class="w-16 h-16 bg-orange-950/60 border border-orange-500/30 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-orange-500/20">
      <i data-lucide="shield-check" class="w-8 h-8 text-orange-400"></i>
    </div>
    <h2 class="text-2xl font-light text-white">Verification Code</h2>
    <p class="text-xs text-gray-400 mt-2">Enter the 6-digit code sent to<br><span class="font-semibold text-orange-400">{{ email }}</span></p>
  </div>

  <form id="otpForm" action="{{ url_for('auth.otp') }}" method="POST" class="my-auto space-y-6 animate-fade-in">
    <div class="flex justify-center gap-2" id="otpContainer">
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" autofocus />
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" />
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" />
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" />
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" />
      <input type="text" name="digit" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="1" required class="otp-input w-11 h-14 text-center text-2xl font-bold rounded-xl border-2 border-gray-700 focus:border-orange-500 outline-none bg-gray-900 text-white shadow-inner transition" />
    </div>

    <button type="submit" class="btn-primary">Verify & Proceed</button>
  </form>

  <div class="pb-6 text-center">
    <button onclick="resendOtp()" class="text-xs text-orange-400 font-medium hover:underline">Didn't receive code? Resend Code</button>
  </div>

</div>

<script>
  const inputs = Array.from(document.querySelectorAll('.otp-input'));
  const otpForm = document.getElementById('otpForm');

  inputs.forEach((input, index) => {
    // Mobile input listener for auto-advancing focus
    input.addEventListener('input', (e) => {
      const val = input.value.replace(/[^0-9]/g, '');
      input.value = val;

      if (val) {
        if (index < inputs.length - 1) {
          inputs[index + 1].focus();
          inputs[index + 1].select();
        } else {
          // Auto submit when 6th digit entered
          const allFilled = inputs.every(i => i.value.length === 1);
          if (allFilled) otpForm.submit();
        }
      }
    });

    // Backspace handling
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
        inputs[index - 1].value = '';
      }
    });

    // Auto select on focus for easy replacement
    input.addEventListener('focus', () => {
      input.select();
    });
  });

  // Paste 6-digit OTP code auto-fill & auto-submit support
  document.getElementById('otpContainer').addEventListener('paste', (e) => {
    e.preventDefault();
    const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').trim();
    if (pastedData.length >= 6) {
      for (let i = 0; i < 6; i++) {
        inputs[i].value = pastedData[i];
      }
      inputs[5].focus();
      otpForm.submit();
    }
  });

  function resendOtp() {
    fetch("{{ url_for('auth.resend_otp') }}", { method: 'POST' })
      .then(res => res.json())
      .then(data => alert(data.message));
  }
</script>
{% endblock %}
